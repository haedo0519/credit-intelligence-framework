[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cif"
version = "0.1.0"
description = "Credit Intelligence Framework - 포트폴리오용 재무분석/여신심사 보조 도구 (실제 심사 시스템 아님)"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.66.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
    "Jinja2==3.1.6",
    "xhtml2pdf==0.2.28",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cif = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm_live: 실제 LLM API를 호출하는 테스트 (기본 실행에서 제외)"]
addopts = "-m 'not llm_live'"
